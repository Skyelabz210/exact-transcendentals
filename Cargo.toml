[workspace]

[package]
name = "exact_transcendentals"
version = "1.0.0"
edition = "2021"
authors = ["HackFate Research <research@hackfate.us>"]
description = "Exact integer arithmetic for transcendental functions — zero floating-point, provable error bounds"
license = "MIT OR Apache-2.0"
keywords = ["math", "transcendental", "cordic", "exact-arithmetic", "fhe"]
categories = ["mathematics", "algorithms", "no-std"]
readme = "README.md"
repository = "https://hackfate.us"

[features]
default = ["std"]
std = []
# Enable SIMD optimizations for CORDIC
simd = []
# Enable arbitrary precision via CRTBigInt integration
arbitrary-precision = []
# Enable CRTBigInt-backed Chudnovsky π (eliminates i128 overflow limit)
crtbigint = []

[dependencies]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
